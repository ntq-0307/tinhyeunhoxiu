<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hành Trình 20 Năm Của Em Mèo - 08/11/2006 Đến 08/11/2026</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts: Đảm bảo 100% tiếng Việt không lỗi font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap&subset=vietnamese" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .font-handwriting {
      font-family: 'Caveat', cursive;
    }

    .font-heading {
      font-family: 'Playfair Display', serif;
    }

    /* Bầu trời chuẩn màu đồng bộ index.html & thu.html */
    .sky-journey-bg {
      background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 35%, #bae6fd 70%, #f0f9ff 100%);
    }

    /* Kim đồng hồ quay ngược nhanh */
    @keyframes clockRewind {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    .animate-clock-rewind-fast {
      animation: clockRewind 0.4s linear infinite;
      transform-origin: 50% 50%;
    }
    .animate-clock-rewind-slow {
      animation: clockRewind 1.6s linear infinite;
      transform-origin: 50% 50%;
    }

    /* Hào quang đồng hồ */
    @keyframes clockGlowPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 0.9; }
    }
    .animate-clock-glow {
      animation: clockGlowPulse 2s ease-in-out infinite;
    }

    /* Mây trôi nền */
    @keyframes cloudDrift {
      0% { transform: translateX(-25vw); }
      100% { transform: translateX(125vw); }
    }
    .cloud-drift-1 { animation: cloudDrift 45s linear infinite; }
    .cloud-drift-2 { animation: cloudDrift 60s linear infinite 8s; }
    .cloud-drift-3 { animation: cloudDrift 35s linear infinite 3s; }

    /* Chuyến bay máy bay đưa đến hành trình của chúng ta */
    @keyframes planeJourneyTakeoff {
      0% {
        transform: translate(-45vw, 65vh) rotate(14deg) scale(0.7);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      45% {
        transform: translate(25vw, 32vh) rotate(2deg) scale(0.98);
      }
      75% {
        transform: translate(68vw, 18vh) rotate(-4deg) scale(1.08);
      }
      100% {
        transform: translate(145vw, -5vh) rotate(-8deg) scale(1.15);
        opacity: 1;
      }
    }
    .animate-plane-gift-takeoff {
      animation: planeJourneyTakeoff 3.4s cubic-bezier(0.35, 0, 0.2, 1) forwards;
      will-change: transform, opacity;
    }

    /* Đung đưa banner theo gió */
    @keyframes bannerJourneySway {
      0%, 100% { transform: rotate(-3deg) translateY(0px); }
      50% { transform: rotate(4deg) translateY(-5px); }
    }
    .banner-journey-sway {
      animation: bannerJourneySway 1.2s ease-in-out infinite;
      transform-origin: right center;
    }

    /* Hiệu ứng cánh quạt xoay */
    @keyframes spinPropeller {
      0% { transform: scaleY(1); opacity: 0.9; }
      50% { transform: scaleY(0.12); opacity: 0.45; }
      100% { transform: scaleY(1); opacity: 0.9; }
    }
    .spin-propeller {
      animation: spinPropeller 0.08s linear infinite;
      transform-origin: center;
    }

    /* Chuyển động bước đi nhấp nhô sống động của Panda */
    @keyframes pandaWalkBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .animate-panda-walk {
      animation: pandaWalkBob 0.6s ease-in-out infinite;
    }

    /* Hiệu ứng chuyển cảnh background cột mốc mượt mà */
    .stage-bg-transition {
      transition: opacity 0.8s ease-in-out, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
  </style>
</head>

    // TRANG CHÍNH: VIDEO MOTION HÀNH TRÌNH 20 NĂM
    function Journey20Page() {
      const [appState, setAppState] = useState('rewind');
      const [rewindYear, setRewindYear] = useState(2026);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [timelineProgress, setTimelineProgress] = useState(0);

      // 1. MỞ ĐẦU: TUA NGƯỢC THỜI GIAN VỀ 08/11/2006
      useEffect(() => {
        let current = 2026;
        const rewindInterval = setInterval(() => {
          current -= 1;
          if (current >= 2006) {
            setRewindYear(current);
          } else {
            clearInterval(rewindInterval);
            setTimeout(() => {
              setAppState('timeline');
            }, 600);
          }
        }, 140);

        return () => clearInterval(rewindInterval);
      }, []);

      // 2. NHÂN VẬT DI CHUYỂN TỪ TRÁI SANG PHẢI TRONG 20S
      useEffect(() => {
        if (appState !== 'timeline') return;

        const TOTAL_DURATION_MS = 20000; // Đúng 20 giây chuyển động
        const intervalStepMs = 100;
        const totalSteps = TOTAL_DURATION_MS / intervalStepMs;
        let stepCount = 0;

        const timelineTimer = setInterval(() => {
          stepCount += 1;
          const progressPercent = Math.min(100, (stepCount / totalSteps) * 100);
          setTimelineProgress(progressPercent);

          const newIdx = Math.min(6, Math.floor((stepCount / totalSteps) * STAGES.length));
          setCurrentIndex(newIdx);

          if (newIdx === 6 && stepCount % 10 === 0) {
            confetti({
              particleCount: 18,
              spread: 60,
              origin: { y: 0.6 },
              colors: ['#f43f5e', '#fb7185', '#fef08a']
            });
          }

          // Hết 20s -> Máy bay cất cánh: Chuyến bay đến hành trình của chúng ta bay sang mv.html
          if (stepCount >= totalSteps) {
            clearInterval(timelineTimer);
            setTimeout(() => {
              setAppState('plane_mv');
              confetti({
                particleCount: 220,
                spread: 110,
                origin: { y: 0.5 },
                colors: ['#f43f5e', '#38bdf8', '#facc15', '#ffffff']
              });

              // Tự động chuyển hướng sang mv.html
              setTimeout(() => {
                try {
                  if (window.location && typeof window.location.href === 'string') {
                    const targetUrl = new URL('mv.html', window.location.href).href;
                    window.location.assign(targetUrl);
                  }
                } catch (e) {
                  console.warn("Chuyển trang sang mv.html:", e);
                }
              }, 3200);
            }, 500);
          }
        }, intervalStepMs);

        return () => clearInterval(timelineTimer);
      }, [appState]);

      const currentStage = STAGES[currentIndex] || STAGES[0];

      return (
        <div className="sky-journey-bg relative w-screen min-h-screen flex items-center justify-center p-3 sm:p-6 overflow-hidden">
          
          {/* MẶT TRỜI TỎA NẮNG DỊU DÀNG (ĐỒNG BỘ CÁC TRANG TRƯỚC) */}
          <div className="fixed -top-20 -left-20 w-80 h-80 rounded-full bg-gradient-to-br from-amber-200/80 via-yellow-100/40 to-transparent blur-3xl pointer-events-none z-0"></div>

          {/* MÂY TRÔI NỀN */}
          <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
            <svg className="cloud-drift-1 absolute top-[10%] text-white/70 filter drop-shadow-sm w-44 h-24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
            <svg className="cloud-drift-2 absolute top-[36%] text-white/50 filter drop-shadow-sm w-64 h-36" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
            <svg className="cloud-drift-3 absolute bottom-[15%] text-white/60 filter drop-shadow-sm w-52 h-28" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
          </div>

          {/* ============================================================ */}
          {/* PHẦN 1: MÀN HÌNH TUA NGƯỢC THỜI GIAN BẰNG ĐỒNG HỒ TRỜI */}
          {/* ============================================================ */}
          {appState === 'rewind' && (
            <div className="flex flex-col items-center justify-center z-30">
              <SkyTimeClock year={rewindYear} />
            </div>
          )}

          {/* ============================================================ */}
          {/* PHẦN 2: VIDEO MOTION 20S - NHÂN VẬT ĐI TỰ DO TỪ TRÁI SANG PHẢI */}
          {/* ============================================================ */}
          {appState === 'timeline' && (
            <div className="fixed inset-0 flex flex-col justify-between z-20 pointer-events-none">
              
              {/* BACKGROUND MINH HỌA TƯƠNG ỨNG TỪNG CỘT MỐC SỰ KIỆN PHÍA SAU */}
              <StageBackground stageId={currentIndex} />

              {/* THANH TIẾN TRÌNH & CÁC CHỮ ĐÁNH DẤU SỰ KIỆN NHỎ GỌN PHÍA TRÊN */}
              <div className="w-full max-w-2xl mx-auto pt-4 sm:pt-6 px-4 relative z-30">
                <div className="bg-white/80 backdrop-blur-md rounded-2xl p-2.5 sm:p-3 shadow-[0_8px_25px_rgba(56,189,248,0.15)] border border-white/70">
                  <div className="flex items-center justify-between text-[11px] sm:text-xs font-bold text-slate-700 mb-1.5">
                    <span className="flex items-center gap-1.5 text-sky-700">
                      <span></span>
                      <span>Hành trình 20 năm</span>
                    </span>
                    <span className="text-rose-600 font-mono font-extrabold">
                      {Math.round((timelineProgress / 100) * 20)}s / 20s
                    </span>
                  </div>

                  {/* Thanh Progress */}
                  <div className="w-full h-2 bg-sky-100 rounded-full overflow-hidden p-0.5">
                    <div 
                      className="h-full bg-gradient-to-r from-sky-400 via-pink-400 to-rose-400 rounded-full transition-all duration-150"
                      style={{ width: `${timelineProgress}%` }}
                    ></div>
                  </div>

                  {/* CÁC CHỮ ĐÁNH DẤU CỘT MỐC NHỎ GỌN, TINH TẾ */}
                  <div className="flex justify-between items-center mt-1.5 px-0.5 text-[9px] sm:text-[10px] text-slate-400 font-bold">
                    {STAGES.map((s, idx) => (
                      <span
                        key={s.id}
                        className={`transition-all duration-300 ${idx === currentIndex ? 'text-rose-600 font-black scale-105' : 'text-slate-400'}`}
                      >
                        {s.year.includes(' - ') ? s.year.split(' - ')[0] : '2026'}
                      </span>
                    ))}
                  </div>
                </div>

                {/* TIÊU ĐỀ SỰ KIỆN HIỆN TẠI (NHỎ XINH, THANH LỊCH LƠ LỬNG GIỮA TRỜI) */}
                <div className="text-center mt-3 sm:mt-5 transition-all duration-500">
                  <div className="inline-flex items-center gap-1.5 bg-white/90 backdrop-blur-md text-slate-700 text-xs sm:text-sm font-bold px-3.5 py-1 rounded-full shadow-sm border border-pink-200">
                    <span>{currentStage.icon}</span>
                    <span className="text-rose-600 font-black">{currentStage.year}</span>
                    <span className="text-slate-300">|</span>
                    <span className="text-slate-800">{currentStage.title}</span>
                  </div>
                </div>
              </div>

              {/* KHU VỰC NHÂN VẬT DI CHUYỂN TỪ TRÁI SANG PHẢI TRÊN BẦU TRỜI */}
              <div className="relative w-full h-44 sm:h-52 mb-8 sm:mb-12">
                <div 
                  className="absolute bottom-2 transition-all duration-150 ease-linear flex items-center justify-center z-20"
                  style={{
                    left: `${timelineProgress}%`,
                    transform: 'translateX(-50%)'
                  }}
                >
                  <PandaCharacter type={currentStage.pandaType} />
                </div>

                {/* Băng mây trắng nhẹ nhàng dưới bước chân */}
                <div className="absolute bottom-0 inset-x-0 h-4 bg-gradient-to-t from-white/70 to-transparent z-20"></div>
              </div>

            </div>
          )}

          {/* ============================================================ */}
          {/* PHẦN 3: MÁY BAY KÉO BANNER BAY SANG TRANG MV.HTML */}
          {/* ============================================================ */}
          {appState === 'plane_mv' && (
            <div className="animate-plane-gift-takeoff fixed top-0 left-0 pointer-events-none z-50">
              <PlaneOurJourney />
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Journey20Page />);
  </script>
</body>
</html>
