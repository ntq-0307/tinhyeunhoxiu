<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday My Love - Bầu Trời Kỷ Niệm</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone để biên dịch JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons & Canvas Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts: Pacifico & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-romantic {
      font-family: 'Dancing Script', cursive;
    }

    /* Bầu trời chuyển sắc chân thực với chiều sâu */
    .sky-bg {
      background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 35%, #bae6fd 70%, #f0f9ff 100%);
    }

    /* Mây trôi nền */
    @keyframes cloudDrift {
      0% { transform: translateX(-25vw); }
      100% { transform: translateX(125vw); }
    }
    .cloud-drift-1 { animation: cloudDrift 55s linear infinite; }
    .cloud-drift-2 { animation: cloudDrift 75s linear infinite 12s; }
    .cloud-drift-3 { animation: cloudDrift 42s linear infinite 5s; }

    /* Chuyển động bay 5s mượt mà chuẩn điện ảnh: lượn sóng tự nhiên, góc nghiêng mượt, không giật lag */
    @keyframes cinematicPandaPlaneIntro {
      0% {
        transform: translate(-35vw, 48vh) rotate(12deg) scale(0.68);
        opacity: 0;
      }
      10% {
        opacity: 1;
        transform: translate(-10vw, 38vh) rotate(8deg) scale(0.78);
      }
      28% {
        transform: translate(22vw, 18vh) rotate(-5deg) scale(0.92);
      }
      48% {
        transform: translate(52vw, 34vh) rotate(7deg) scale(1.02);
      }
      72% {
        transform: translate(84vw, 16vh) rotate(-4deg) scale(1.08);
      }
      90% {
        opacity: 1;
        transform: translate(115vw, 24vh) rotate(5deg) scale(1.12);
      }
      100% {
        transform: translate(142vw, 20vh) rotate(4deg) scale(1.15);
        opacity: 0;
      }
    }
    .animate-cute-intro {
      animation: cinematicPandaPlaneIntro 5s cubic-bezier(0.37, 0, 0.22, 1) forwards;
      will-change: transform, opacity;
    }

    /* Hoạt cảnh máy bay kéo hòm thư lúc thành công */
    @keyframes cutePlaneFlyMail {
      0% {
        transform: translate(-42vw, 42vh) rotate(10deg) scale(0.75);
        opacity: 0;
      }
      12% {
        opacity: 1;
      }
      40% {
        transform: translate(32vw, 20vh) rotate(-4deg) scale(0.98);
      }
      70% {
        transform: translate(75vw, 30vh) rotate(6deg) scale(1.05);
      }
      100% {
        transform: translate(145vw, 16vh) rotate(2deg) scale(1.12);
        opacity: 1;
      }
    }
    .animate-cute-mailbox {
      animation: cutePlaneFlyMail 5.2s cubic-bezier(0.35, 0, 0.25, 1) forwards;
      will-change: transform, opacity;
    }

    /* Hiệu ứng cánh quạt xoay tít mù */
    @keyframes spinPropeller {
      0% { transform: scaleY(1); opacity: 0.9; }
      50% { transform: scaleY(0.12); opacity: 0.45; }
      100% { transform: scaleY(1); opacity: 0.9; }
    }
    .propeller-spin {
      animation: spinPropeller 0.08s linear infinite;
      transform-origin: center;
    }

    /* Đám mây xả đuôi nhấp nhô tròn trịa dễ thương */
    @keyframes cuteCloudPuff {
      0% { transform: scale(0.8) translateY(0); opacity: 0.85; }
      50% { transform: scale(1.15) translateY(-3px); opacity: 1; }
      100% { transform: scale(0.8) translateY(0); opacity: 0.85; }
    }
    .puff-1 { animation: cuteCloudPuff 0.6s ease-in-out infinite; }
    .puff-2 { animation: cuteCloudPuff 0.6s ease-in-out infinite 0.2s; }
    .puff-3 { animation: cuteCloudPuff 0.6s ease-in-out infinite 0.4s; }

    /* Dải banner đuôi lượn sóng */
    @keyframes bannerWave {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(3deg) translateY(-4px); }
    }
    .banner-wave {
      animation: bannerWave 1.2s ease-in-out infinite;
      transform-origin: right center;
    }

    /* Đám mây 3D bồng bềnh trung tâm */
    @keyframes floatCloudSoft {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-14px) rotate(0.5deg);
      }
    }
    .cloud-3d-floating {
      animation: floatCloudSoft 4.5s ease-in-out infinite;
    }

    /* Rung lắc khi nhập sai */
    @keyframes cloudShake {
      0%, 100% { transform: translateX(0); }
      15%, 45%, 75% { transform: translateX(-12px); }
      30%, 60%, 90% { transform: translateX(12px); }
    }
    .animate-cloud-shake {
      animation: cloudShake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* Hòm thư lắc lư theo gió khi bay */
    @keyframes mailboxSway {
      0%, 100% { transform: rotate(-6deg) translateY(0px); }
      50% { transform: rotate(8deg) translateY(-8px); }
    }
    .mailbox-sway {
      animation: mailboxSway 1.2s ease-in-out infinite;
      transform-origin: left center;
    }
  </style>
</head>
<body class="sky-bg w-screen h-screen relative overflow-hidden flex items-center justify-center">

  <div id="root" class="w-full h-full"></div>

  <!-- SCRIPT REACT -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // COMPONENT SVG: MÁY BAY CHIBI CÁNH QUẠT DỄ THƯƠNG (CUTE CHIBI AIRPLANE)
    const CuteAirplane = ({ isCarryingMail = false }) => {
      return (
        <div className="relative flex items-center select-none filter drop-shadow-[0_12px_24px_rgba(14,116,144,0.25)]">
          
          {/* 1. HIỆU ỨNG PHÍA SAU KHI KHÔNG KÉO THƯ: KHÓI MÂY TRÒN & BANNER RỰC RỠ */}
          {!isCarryingMail && (
            <div className="flex items-center mr-[-8px] z-0">
              {/* Cụm mây khói phì phò từ đuôi dễ thương */}
              <div className="flex items-center gap-1.5 mr-2">
                <span className="w-5 h-5 rounded-full bg-white/80 filter blur-[1px] puff-3"></span>
                <span className="w-7 h-7 rounded-full bg-white/90 filter blur-[1px] puff-2"></span>
                <span className="w-9 h-9 rounded-full bg-white puff-1 shadow-sm"></span>
              </div>
              
              {/* Dải nơ banner bay lượn sóng chúc mừng */}
              <div className="banner-wave hidden sm:flex items-center bg-white/95 backdrop-blur-md px-4 py-2 rounded-full border-2 border-pink-200 shadow-lg text-xs font-black text-rose-500 whitespace-nowrap gap-1.5">
                <span className="text-base animate-bounce"></span>
                <span>Chuyến bay hạnh phúc của em Mèo</span>
                <span className="text-base animate-pulse"></span>
              </div>
            </div>
          )}

          {/* 2. DÂY CÁP NỐI & HÒM THƯ (KHI NHẬP ĐÚNG PASS) */}
          {isCarryingMail && (
            <div className="flex items-center mr-[-4px] z-10">
              {/* HÒM THƯ TÌNH YÊU 3D ĐỘC ĐÁO */}
              <div className="mailbox-sway flex items-center bg-white/95 backdrop-blur-md p-3.5 rounded-3xl shadow-[0_16px_35px_rgba(244,63,94,0.32)] border-3 border-pink-300">
                <div className="relative w-12 h-12 bg-gradient-to-tr from-rose-500 via-pink-500 to-rose-400 rounded-2xl flex items-center justify-center text-white shadow-inner mr-3">
                  <svg className="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2">
                    <rect width="20" height="16" x="2" y="4" rx="3" />
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                  </svg>
                  <span className="absolute -top-2 -right-1 text-base animate-bounce">💌</span>
                </div>
                
                <div className="pr-2 text-left">
                  <div className="flex items-center gap-1.5">
                    <span className="bg-rose-100 text-rose-600 text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full">
                      Lá Thư Tình Yêu
                    </span>
                    <span className="text-xs"></span>
                  </div>
                  <div className="text-sm font-black text-slate-800 tracking-tight whitespace-nowrap mt-0.5">
                    Lá thư dành cho em
                  </div>
                </div>
              </div>

              {/* Dây ruy-băng lụa nối máy bay và hòm thư */}
              <svg className="w-16 h-8 -ml-1 text-pink-400" viewBox="0 0 60 20">
                <path d="M0,10 Q30,18 60,10" fill="none" stroke="#f472b6" strokeWidth="3" strokeDasharray="5 3" />
              </svg>
            </div>
          )}

          {/* 3. MÁY BAY CHIBI CÁNH QUẠT DỄ THƯƠNG NÉT HOẠT HÌNH */}
          <svg className="w-48 h-36 md:w-56 md:h-40 transform relative z-20" viewBox="0 0 280 200" fill="none">
            <defs>
              <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stopColor="#ffffff" />
                <stop offset="45%" stopColor="#fdf4ff" />
                <stop offset="100%" stopColor="#fbcfe8" />
              </linearGradient>

              <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#38bdf8" />
                <stop offset="100%" stopColor="#0284c7" />
              </linearGradient>

              <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#bae6fd" />
                <stop offset="60%" stopColor="#7dd3fc" />
                <stop offset="100%" stopColor="#38bdf8" />
              </linearGradient>
            </defs>

            {/* Cánh sau xa */}
            <ellipse cx="65" cy="85" rx="30" ry="12" fill="#0284c7" transform="rotate(-18 65 85)" />

            {/* Đuôi máy bay tròn xinh */}
            <path d="M35 110 C25 65, 45 40, 68 50 C75 75, 70 95, 60 115 Z" fill="#f43f5e" stroke="#e11d48" strokeWidth="2.5" />
            <circle cx="53" cy="65" r="5" fill="#ffffff" />

            {/* THÂN CHÍNH MÁY BAY CHIBI MẬP MẠP */}
            <path d="M40 120 C40 85, 80 60, 160 62 C230 64, 255 95, 255 122 C255 152, 215 168, 140 166 C70 164, 40 145, 40 120 Z" 
                  fill="url(#bodyGrad)" stroke="#f472b6" strokeWidth="3.5" />

            {/* BỤNG MÁY BAY HỒNG NHẠT DỄ THƯƠNG */}
            <path d="M60 135 C95 160, 180 160, 240 130 C220 158, 160 166, 75 160 Z" fill="#f472b6" opacity="0.35" />

            {/* BUỒNG LÁI TRÒN TRONG SUỐT VỚI CHÚ GẤU PHI CÔNG */}
            <ellipse cx="175" cy="85" rx="42" ry="32" fill="url(#glassGrad)" stroke="#38bdf8" strokeWidth="3" />
            <path d="M152 70 Q175 60 200 70" stroke="#ffffff" strokeWidth="3.5" strokeLinecap="round" opacity="0.8" />

            {/* PHI CÔNG GẤU TRÚC PANDA ĐÁNG YÊU NGỒI TRONG BUỒNG LÁI */}
            <g transform="translate(152, 57)">
              {/* Khăn quàng cổ phi công đỏ bay phấp phới */}
              <path d="M14 36 Q8 42 4 48 Q10 46 16 42 Z" fill="#ef4444" className="animate-pulse" />
              <rect x="13" y="32" width="20" height="7" rx="3.5" fill="#ef4444" />

              {/* Tai gấu trúc Panda tròn xoe màu đen nhung */}
              <circle cx="9" cy="11" r="7.5" fill="#18181b" />
              <circle cx="9.5" cy="11.5" r="4.5" fill="#27272a" />
              <circle cx="36" cy="11" r="7.5" fill="#18181b" />
              <circle cx="35.5" cy="11.5" r="4.5" fill="#27272a" />

              {/* Đầu tròn trắng tinh khôi của Panda */}
              <ellipse cx="22.5" cy="23" rx="18.5" ry="16" fill="#ffffff" stroke="#f1f5f9" strokeWidth="1.2" />

              {/* Quầng mắt đen đặc trưng hình hạt đậu nghiêng của gấu trúc */}
              <ellipse cx="14.5" cy="20.5" rx="6.5" ry="5.5" fill="#18181b" transform="rotate(-18 14.5 20.5)" />
              <ellipse cx="30.5" cy="20.5" rx="6.5" ry="5.5" fill="#18181b" transform="rotate(18 30.5 20.5)" />

              {/* Mắt to tròn long lanh phản chiếu ánh sáng */}
              <circle cx="15.5" cy="20" r="2.8" fill="#ffffff" />
              <circle cx="16.2" cy="19.5" r="1.3" fill="#09090b" />
              <circle cx="15" cy="20.5" r="0.7" fill="#ffffff" />

              <circle cx="29.5" cy="20" r="2.8" fill="#ffffff" />
              <circle cx="28.8" cy="19.5" r="1.3" fill="#09090b" />
              <circle cx="30" cy="20.5" r="0.7" fill="#ffffff" />

              {/* Mũ phi công cổ điển màu nâu cam trên đỉnh đầu */}
              <path d="M13 10 C16 4, 29 4, 32 10 Z" fill="#92400e" />
              <rect x="11.5" y="9" width="22" height="3.5" rx="1.75" fill="#b45309" />

              {/* Mũi & Miệng cười chúm chím */}
              <ellipse cx="22.5" cy="26.5" rx="3" ry="2" fill="#18181b" />
              <path d="M19.5 29 Q22.5 32 25.5 29" stroke="#18181b" strokeWidth="1.5" strokeLinecap="round" fill="none" />

              {/* Hai má ửng hồng phấn siêu cưng */}
              <circle cx="10" cy="26" r="3.2" fill="#fb7185" opacity="0.65" />
              <circle cx="35" cy="26" r="3.2" fill="#fb7185" opacity="0.65" />
            </g>

            {/* MÁ HỒNG CHIBI & TRÁI TIM TRÊN MÁY BAY */}
            <circle cx="218" cy="128" r="8" fill="#fda4af" opacity="0.8" />
            <path d="M214 128 C214 126, 216 124, 218 126 C220 124, 222 126, 222 128 C222 130, 218 133, 218 133 C218 133, 214 130, 214 128 Z" fill="#e11d48" />

            {/* MẮT CHIBI CHỚP NHÁY LONG LANH */}
            <circle cx="228" cy="112" r="5" fill="#1e293b" />
            <circle cx="229.5" cy="110.5" r="2" fill="#ffffff" />
            <circle cx="226.5" cy="113.5" r="1" fill="#ffffff" />

            {/* MIỆNG CƯỜI TƯƠI */}
            <path d="M236 124 Q240 130 246 124" stroke="#e11d48" strokeWidth="2.5" strokeLinecap="round" fill="none" />

            {/* CÁNH CHÍNH PHÍA TRƯỚC RẤT MƯỢT */}
            <path d="M110 126 C110 126, 80 185, 125 185 C165 185, 185 130, 185 126 Z" 
                  fill="url(#wingGrad)" stroke="#0284c7" strokeWidth="2.5" />
            <path d="M102 168 Q125 182 145 168" stroke="#ffffff" strokeWidth="2.5" strokeLinecap="round" opacity="0.6" fill="none" />

            {/* MŨI MÁY BAY GẮN CÁNH QUẠT (PROPELLER) */}
            <ellipse cx="255" cy="118" rx="7" ry="12" fill="#f43f5e" />

            {/* CÁNH QUẠT QUAY TÍT (SPINNING PROPELLER) */}
            <g className="propeller-spin" style={{ transformOrigin: '258px 118px' }}>
              <ellipse cx="258" cy="85" rx="5.5" ry="32" fill="#38bdf8" opacity="0.85" />
              <ellipse cx="258" cy="151" rx="5.5" ry="32" fill="#38bdf8" opacity="0.85" />
            </g>
            <circle cx="258" cy="118" r="6" fill="#f59e0b" stroke="#ffffff" strokeWidth="2" />
          </svg>
        </div>
      );
    };

    // ỨNG DỤNG CHÍNH
    function App() {
      // Trạng thái: 'intro' -> 'input_ready' -> 'success'
      const [stage, setStage] = useState('intro');
      const [pin, setPin] = useState(['', '', '', '']);
      const [errorMsg, setErrorMsg] = useState('');
      const [isShaking, setIsShaking] = useState(false);
      const [showModal, setShowModal] = useState(false);

      const inputRefs = [useRef(null), useRef(null), useRef(null), useRef(null)];
      const CORRECT_PASS = '0811';

      // 1. Quản lý mở đầu: Máy bay chibi bay lượn 5 giây trọn vẹn rồi xuất hiện form mây
      useEffect(() => {
        const timer = setTimeout(() => {
          setStage('input_ready');
        }, 5000); // Bay trọn vẹn 5.0 giây

        return () => clearTimeout(timer);
      }, []);

      // Tự động focus ô đầu tiên khi đám mây hiện ra
      useEffect(() => {
        if (stage === 'input_ready' && inputRefs[0].current) {
          inputRefs[0].current.focus();
        }
      }, [stage]);

      // 2. Xử lý gõ phím ô PIN
      const handleInputChange = (index, value) => {
        // Chỉ lấy số
        const cleanVal = value.replace(/[^0-9]/g, '');
        if (!cleanVal && value !== '') return;

        const newPin = [...pin];
        newPin[index] = cleanVal.slice(-1); // Lấy ký tự mới nhất
        setPin(newPin);
        setErrorMsg('');

        // Tự động nhảy ô tiếp theo
        if (cleanVal && index < 3) {
          inputRefs[index + 1].current?.focus();
        }

        // Nếu đã đủ 4 số, tự động kiểm tra ngay
        const fullCode = newPin.join('');
        if (fullCode.length === 4 && newPin.every(k => k !== '')) {
          validatePass(fullCode);
        }
      };

      // Xử lý Backspace & Phím mũi tên
      const handleKeyDown = (index, e) => {
        if (e.key === 'Backspace') {
          if (!pin[index] && index > 0) {
            inputRefs[index - 1].current?.focus();
          }
        } else if (e.key === 'ArrowLeft' && index > 0) {
          inputRefs[index - 1].current?.focus();
        } else if (e.key === 'ArrowRight' && index < 3) {
          inputRefs[index + 1].current?.focus();
        }
      };

      // Hỗ trợ paste chuỗi 4 chữ số
      const handlePaste = (e) => {
        e.preventDefault();
        const pasteData = e.clipboardData.getData('text').trim();
        if (/^\d{4}$/.test(pasteData)) {
          const splitDigits = pasteData.split('');
          setPin(splitDigits);
          inputRefs[3].current?.focus();
          validatePass(pasteData);
        }
      };

      // 3. Kiểm tra mật mã
      const validatePass = (enteredCode) => {
        if (enteredCode === CORRECT_PASS) {
          // THÀNH CÔNG: Chuyển sang stage success
          setStage('success');
          fireConfetti();

          // Hiện modal thông báo sau 2s
          setTimeout(() => {
            setShowModal(true);
          }, 2400);

          // Chuyển hướng sang thu.html sau khoảng 4.6s khi người xem ngắm xong máy bay kéo thư
          setTimeout(() => {
            window.location.href = 'thu.html';
          }, 4800);
        } else {
          // THẤT BẠI: Rung lắc, báo lỗi đỏ và reset ô nhập
          setIsShaking(true);
          setErrorMsg('Chưa đúng rồi nè, thử lại nha 🥺');
          setTimeout(() => {
            setIsShaking(false);
            setPin(['', '', '', '']);
            inputRefs[0].current?.focus();
          }, 950);
        }
      };

      // Hiệu ứng pháo giấy trái tim & sao rực rỡ
      const fireConfetti = () => {
        const count = 200;
        const defaults = { origin: { y: 0.7 } };

        function fire(particleRatio, opts) {
          confetti({
            ...defaults,
            ...opts,
            particleCount: Math.floor(count * particleRatio)
          });
        }

        fire(0.25, { spread: 26, startVelocity: 55, colors: ['#f43f5e', '#ec4899', '#38bdf8'] });
        fire(0.2, { spread: 60, colors: ['#ffffff', '#fcd34d', '#38bdf8'] });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, colors: ['#e11d48', '#fda4af'] });
        fire(0.1, { spread: 120, startVelocity: 45 });
      };

      return (
        <div class="relative w-full h-full flex items-center justify-center overflow-hidden">
          
          {/* MẶT TRỜI TỎA ÁNH NẮNG DỊU DÀNG GÓC TRÊN */}
          <div class="absolute -top-20 -left-20 w-80 h-80 rounded-full bg-gradient-to-br from-amber-200/90 via-yellow-100/50 to-transparent blur-2xl pointer-events-none"></div>

          {/* CÁC ĐÁM MÂY TỰ NHIÊN TRÔI NỀN */}
          <div className="absolute inset-0 pointer-events-none overflow-hidden">
            <svg className="cloud-drift-1 absolute top-[14%] text-white/70 filter drop-shadow-sm w-44 h-24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
            <svg className="cloud-drift-2 absolute top-[38%] text-white/50 filter drop-shadow-sm w-64 h-36" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
            <svg className="cloud-drift-3 absolute bottom-[15%] text-white/60 filter drop-shadow-sm w-52 h-28" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
            </svg>
          </div>

          {/* 1. HIỆU ỨNG MỞ ĐẦU: MÁY BAY CHIBI BAY LƯỢN 5 GIÂY SIÊU MƯỢT (KHÔNG CÓ HÒM THƯ) */}
          {stage === 'intro' && (
            <div className="animate-cute-intro absolute top-0 left-0 pointer-events-none z-30">
              <CuteAirplane isCarryingMail={false} />
            </div>
          )}

          {/* 2. ĐÁM MÂY 3D TRUNG TÂM NHẬP MÃ (PASS: 0811) */}
          <div className={`relative z-20 mx-4 max-w-md w-full transition-all duration-700 ${
            stage === 'input_ready' ? 'opacity-100 scale-100' : stage === 'success' ? 'opacity-40 scale-95 pointer-events-none' : 'opacity-0 scale-90 pointer-events-none'
          }`}>
            
            {/* Vỏ mây bồng bềnh 3D */}
            <div className={`cloud-3d-floating relative bg-white/95 backdrop-blur-xl rounded-[40px] p-7 sm:p-9 shadow-[0_25px_60px_-15px_rgba(56,189,248,0.4)] border-4 border-white ${isShaking ? 'animate-cloud-shake' : ''}`}>
              
              {/* Khối mây tròn tạo hình 3D xung quanh */}
              <div className="absolute -top-12 left-10 w-28 h-28 bg-white/95 rounded-full -z-10 shadow-sm"></div>
              <div className="absolute -top-16 right-12 w-32 h-32 bg-white/95 rounded-full -z-10 shadow-sm"></div>
              <div className="absolute -bottom-8 left-14 w-24 h-24 bg-white/95 rounded-full -z-10"></div>
              <div className="absolute -bottom-8 right-16 w-28 h-28 bg-white/95 rounded-full -z-10"></div>

              {/* Icon Trái tim mây dễ thương */}
              <div className="flex justify-center mb-2">
                <div className="w-16 h-16 bg-gradient-to-tr from-sky-400 via-sky-300 to-pink-300 rounded-3xl flex items-center justify-center text-white shadow-lg transform hover:scale-105 transition-transform">
                  <svg className="w-9 h-9 drop-shadow" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                  </svg>
                </div>
              </div>

              {/* Tiêu đề & Lời nhắn */}
              <h1 className="text-3xl font-romantic text-sky-900 font-bold mb-1 text-center">
                Happy Birthday, Em Mèo !
              </h1>
              <p className="text-sm text-slate-500 font-semibold mb-6 text-center leading-relaxed">
                Bầu trời cất giữ một món quà dành riêng cho em.<br/>
                <span className="text-sky-600 font-extrabold">Nhập mật mã 4 số để giải mã nhé:</span>
              </p>

              {/* CÁC Ô NHẬP PIN 4 SỐ */}
              <div className="flex justify-center items-center gap-3 sm:gap-4 mb-4" onPaste={handlePaste}>
                {pin.map((digit, idx) => (
                  <input
                    key={idx}
                    ref={inputRefs[idx]}
                    type="password"
                    inputMode="numeric"
                    maxLength={1}
                    value={digit}
                    onChange={(e) => handleInputChange(idx, e.target.value)}
                    onKeyDown={(e) => handleKeyDown(idx, e)}
                    disabled={stage === 'success'}
                    className={`w-13 h-16 sm:w-16 sm:h-20 text-center text-3xl font-black rounded-2xl outline-none transition-all duration-200 shadow-inner ${
                      errorMsg 
                        ? 'border-2 border-rose-400 bg-rose-50 text-rose-600 ring-4 ring-rose-100' 
                        : 'border-2 border-sky-200 bg-sky-50/70 text-sky-800 focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-200'
                    }`}
                  />
                ))}
              </div>

              {/* THÔNG BÁO LỖI HOẶC GỢI Ý */}
              <div className="min-h-[28px] flex items-center justify-center text-center px-2">
                {errorMsg ? (
                  <span className="text-xs sm:text-sm font-extrabold text-rose-500 flex items-center gap-1.5 animate-pulse">
                    <span></span> {errorMsg}
                  </span>
                ) : (
                  <span className="text-xs text-sky-400 font-bold flex items-center gap-1">
                    <span></span> Gợi ý: Ngày Em Mèo Được Sinh Ra Đời
                  </span>
                )}
              </div>

              {/* Nút xóa làm lại */}
              <div className="mt-4 pt-3 border-t border-sky-100 flex items-center justify-between text-xs text-slate-400">
                <span className="font-medium text-sky-600/70">Tình Yêu Nhỏ Xíu</span>
                <button
                  onClick={() => {
                    setPin(['', '', '', '']);
                    setErrorMsg('');
                    inputRefs[0].current?.focus();
                  }}
                  className="text-sky-500 hover:text-sky-700 font-bold underline underline-offset-2 transition-colors cursor-pointer"
                >
                  Xóa nhập lại
                </button>
              </div>
            </div>
          </div>

          {/* 3. HIỆU ỨNG THÀNH CÔNG: MÁY BAY KÉO HÒM THƯ TÌNH YÊU BAY QUA */}
          {stage === 'success' && (
            <div className="animate-cute-mailbox absolute top-0 left-0 pointer-events-none z-40">
              <CuteAirplane isCarryingMail={true} />
            </div>
          )}

          {/* MODAL THÔNG BÁO TỰ ĐỘNG CHUYỂN HƯỚNG SANG THU.HTML */}
          {showModal && (
            <div className="fixed inset-0 bg-sky-950/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all duration-500">
              <div className="bg-white rounded-3xl p-7 max-w-sm w-full text-center shadow-2xl border-4 border-sky-100 transform scale-100 animate-[bounce_1s_ease-out_1]">
                <div className="w-16 h-16 bg-pink-100 text-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner text-3xl">
                  💌
                </div>
                <h3 className="text-2xl font-bold font-romantic text-sky-900 mb-1">
                  Đúng rồi em yêu ơi!
                </h3>
                <p className="text-xs sm:text-sm text-slate-600 font-medium mb-5">
                  Giờ thì cùng nhau mở thư nhé!
                </p>
                <div className="flex items-center justify-center gap-2 text-sky-600 font-bold text-sm bg-sky-50 py-2.5 px-4 rounded-xl">
                  <svg className="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10" strokeOpacity="0.2" />
                    <path d="M12 2a10 10 0 0 1 10 10" />
                  </svg>
                  <span>Đang mở lá thư dành cho em</span>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Khởi tạo React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
